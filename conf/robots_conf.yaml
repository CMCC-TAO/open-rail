robots:
  target: 'mock' # 文件夹名也需要与此一致
  a2d:
    camera:
      ref: 'cam.head' # 参考该相机时间戳
      names: # 映射要获取的相机数据
        cam.head: 'head'
        cam.hand_left: 'hand_left'
        cam.hand_right: 'hand_right'
        # cam.depth.head: 'head_depth'
    proprio_names: ['arm', 'gripper', 'head', 'waist']
    control_dt: 0.005
    gripper_freq: 40
  isaac:
    control_dt: 0.005
  mock:
    camera:
      ref: 'cam.head' # 参考该相机时间戳
      names: # 映射要获取的相机数据
        cam.head: 'observation.images.top_head'
        cam.hand_left: 'observation.images.hand_left'
        cam.hand_right: 'observation.images.hand_right'
        # cam.depth.head: 'observation.images.head_depth'
    root: '/home/robot/Music/task_39_only1'
    repo_id: 'task_39_only1'
