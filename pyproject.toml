[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-rail"
description = "A universal substrate for asynchronously linking VLA/WAM model inference and robot execution"
# The project has not adopted formal release versioning yet.
version = "0.0.0"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Yongsheng Zhao" },
  { name = "Lei Zhao" },
  { name = "Baoping Cheng" },
  { name = "Gongxin Yao" },
  { name = "Xuanzhang Wen" },
  { name = "Han Gao" },
]
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.46.0",
  "python-multipart>=0.0.9",
  "orjson>=3.10.0",
  "ml-collections==1.1.0",
  "numpy==1.26.4",
  "opencv-python==4.11.0.86",
  "pandas==2.2.3",
  "pyarrow==18.1.0",
  "PyYAML==6.0.3",
  "rich==15.0.0",
  "scipy==1.15.3",
  "websockets==16.0",
  "psutil>=5.9.0",
  "pyzmq>=26.0.0",
]

[project.optional-dependencies]
dev = [
  "build>=1.2.2",
  "pytest>=8.0.0",
  "ruff>=0.11.0",
  "twine>=5.1.1",
]
# Optional desktop viewers under client/utils/ (action/camera plots).
# Not required by the core runtime; install with: pip install -e ".[viz]"
viz = [
  "PyQt5==5.15.11",
  "pyqtgraph==0.14.0",
  "matplotlib==3.10.9",
]

[project.scripts]
open-rail-web-client = "run_web_client:main"
open-rail-server = "run_server:main"

[tool.setuptools]
include-package-data = true
py-modules = ["run_web_client", "run_server"]

[tool.setuptools.packages.find]
where = ["."]
include = ["client*", "conf*", "server*", "web_client*"]
namespaces = true

[tool.setuptools.package-data]
conf = ["*.json", "*.yaml", "*.yml"]
web_client = ["static/**/*"]
server = ["**/*.json", "**/*.yaml", "**/*.yml", "**/*.md", "**/*.txt"]
client = ["**/*.json", "**/*.yaml", "**/*.yml", "**/*.md", "**/*.txt"]

[tool.ruff]
line-length = 100
