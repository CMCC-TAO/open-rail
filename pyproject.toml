[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vla-rail"
dynamic = ["version"]
description = "A real-time asynchronous inference linker for VLA models and robots"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
  { name = "Yongsheng Zhao" },
  { name = "Lei Zhao" },
  { name = "Baoping Cheng" },
  { name = "Gongxin Yao" },
  { name = "Xuanzhang Wen" },
  { name = "Han Gao" },
]
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.46.0",
  "python-multipart>=0.0.9",
  "ml-collections==1.1.0",
  "numpy==1.26.4",
  "opencv-python==4.11.0.86",
  "pandas==2.2.3",
  "pyarrow==18.1.0",
  "PyYAML==6.0.3",
  "rich==15.0.0",
  "scipy==1.15.3",
  "websockets==16.0",
  "psutil>=5.9.0",
  "pyzmq>=26.0.0",
]

[project.optional-dependencies]
dev = [
  "build>=1.2.2",
  "pytest>=8.0.0",
  "twine>=5.1.1",
]

[project.scripts]
vla-web-client = "run_web_client:main"
vla-server = "run_server:main"

[tool.setuptools]
include-package-data = true
py-modules = ["run_web_client", "run_server"]

[tool.setuptools.dynamic]
version = { attr = "vla_rail.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["client*", "conf*", "server*", "web_client*", "vla_rail*"]
namespaces = true

[tool.setuptools.package-data]
conf = ["*.json", "*.yaml", "*.yml"]
web_client = ["static/**/*"]
server = ["**/*.json", "**/*.yaml", "**/*.yml", "**/*.md", "**/*.txt"]
client = ["**/*.json", "**/*.yaml", "**/*.yml", "**/*.md", "**/*.txt"]
vla_rail = []

[tool.ruff]
line-length = 100
