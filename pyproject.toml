[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

# TODO(OPEN-RAIL 更名)：开源前完成仓库与包名替换
#   1. 仓库目录 vla_infer → open_rail；项目名 vla-rail → open-rail；description 与 README 内标题同步
#   2. 新增 open_rail/__init__.py 定义 __version__，并把本文件内所有 vla_rail 引用改为 open_rail。
#      当前 vla_rail 包在仓库中不存在，动态版本解析失败会直接中断 pip install -e .
#   3. CLI 入口名 vla-server / vla-web-client 是否一并改为 open-rail-*，改则须与 README 快速开始同步

[project]
name = "vla-rail"
dynamic = ["version"]
description = "A real-time asynchronous inference linker for VLA models and robots"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
  { name = "Yongsheng Zhao" },
  { name = "Lei Zhao" },
  { name = "Baoping Cheng" },
  { name = "Gongxin Yao" },
  { name = "Xuanzhang Wen" },
  { name = "Han Gao" },
]
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.46.0",
  "python-multipart>=0.0.9",
  "ml-collections==1.1.0",
  "numpy==1.26.4",
  "opencv-python==4.11.0.86",
  "pandas==2.2.3",
  "pyarrow==18.1.0",
  "PyYAML==6.0.3",
  "rich==15.0.0",
  "scipy==1.15.3",
  "websockets==16.0",
  "psutil>=5.9.0",
  "pyzmq>=26.0.0",
]

[project.optional-dependencies]
dev = [
  "build>=1.2.2",
  "pytest>=8.0.0",
  "twine>=5.1.1",
]

[project.scripts]
vla-web-client = "run_web_client:main"
vla-server = "run_server:main"

[tool.setuptools]
include-package-data = true
py-modules = ["run_web_client", "run_server"]

[tool.setuptools.dynamic]
# TODO(OPEN-RAIL 更名)：改为 open_rail.__version__，并确保 open_rail/__init__.py 已提供该属性
version = { attr = "vla_rail.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["client*", "conf*", "server*", "web_client*", "vla_rail*"]
namespaces = true

[tool.setuptools.package-data]
conf = ["*.json", "*.yaml", "*.yml"]
web_client = ["static/**/*"]
server = ["**/*.json", "**/*.yaml", "**/*.yml", "**/*.md", "**/*.txt"]
client = ["**/*.json", "**/*.yaml", "**/*.yml", "**/*.md", "**/*.txt"]
vla_rail = []

[tool.ruff]
line-length = 100
